name: Bug report
description: Something in DIRGE doesn't work as it should (one bug per issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues here are for DIRGE, not Felucca. Ideas and requests: use the **Idea** template.
  - type: input
    id: version
    attributes:
      label: DIRGE version
      description: Hold HOME > SYSTEM > ABOUT on the FM-1
      placeholder: "v0.2"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - On the FM-1
        - In the browser demo
        - In the editor
        - In the installer
        - With MIDI (clock, notes, learn)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the editor, installer, demo or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo, a short video or a recording helps.
    validations:
      required: true
