# DIRGE's host tests on every push and pull request: the DSP library and the firmware rendered on the computer,
# checked and compared with tests/golden.txt (tests/run.sh). No Docker or FM-1 needed; the renders are kept as
# an artifact to listen to.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: build/tests/*.wav
          if-no-files-found: ignore
